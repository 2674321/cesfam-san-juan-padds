name: CI

on:
  push:
    branches: ['**']

jobs:
  sintaxis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sintaxis JS — node --check
        run: |
          fallos=0
          while IFS= read -r f; do
            node --check "$f" || { echo "ERROR de sintaxis: $f"; fallos=1; }
          done < <(find . -type f -name '*.js' -not -path './node_modules/*')
          exit $fallos
